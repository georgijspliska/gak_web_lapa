<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/style.css">
  </head>
  <body class="page-contact">
    <header class="site-head">
      <nav class="nav" aria-label="Main">
        <div class="nav-left">
          <!-- Swap this <a> block for <a class="wordmark" href="index.html"><img src="assets/logo.svg" alt="Studio"></a> -->
          <a class="wordmark" href="index.html">
              <span class="wordmark-name">georgijs<span class="wordmark-dot">.</span>kamera</span>
            </a>
          <ul class="nav-links">
            <li><a href="index.html">Photos</a></li>
            <li><a href="contact.html" aria-current="page">Contact</a></li>
          </ul>
        </div>
        <div class="nav-right">
          <a href="https://instagram.com/georgijs.kamera" target="_blank" rel="noopener" aria-label="Instagram">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="4.1"/><circle class="solid" cx="17.3" cy="6.7" r="1.15"/></svg>
          </a>
          <a href="https://facebook.com/georgijs.kamera" target="_blank" rel="noopener" aria-label="Facebook">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="solid" d="M13.9 21.5v-8.2h2.8l.42-3.2H13.9V8.05c0-.93.26-1.56 1.6-1.56h1.7V3.63c-.3-.04-1.3-.13-2.47-.13-2.45 0-4.13 1.49-4.13 4.23v2.37H7.8v3.2h2.8v8.2z"/></svg>
          </a>
        </div>
      </nav>
    </header>
    <main class="contact-wrap">
      <div class="contact-card">
        <h1>Get in touch</h1>
        <form class="form" id="contactForm" novalidate>
          <label class="field">
            <span class="field-label">Name</span>
            <input type="text" name="name" autocomplete="name" required>
          </label>
          <label class="field">
            <span class="field-label">Email</span>
            <input type="email" name="email" autocomplete="email" required>
          </label>
          <label class="field">
            <span class="field-label">Message</span>
            <textarea name="message" rows="5" required></textarea>
          </label>
          <!-- spam trap: real people never fill this, bots do -->
          <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
          <button class="btn" type="submit" id="submitBtn">Send message</button>
          <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
        </form>
      </div>
    </main>
    <script src="assets/main.js"></script>
  </body>
</html>
